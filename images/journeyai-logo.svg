  <path d="M30 112 A90 90 0 0 0 210 112 Z" fill="#7BC96F"/>
  <path d="M40 112 A80 80 0 0 0 200 112 Z" fill="#FFF3E6"/>
  <path d="M46 112 A74 74 0 0 0 194 112 Z" fill="#FF4D6D"/>
  <!-- seeds -->
  <g fill="#123524">
    <ellipse cx="92" cy="146" rx="6" ry="10" transform="rotate(-24 92 146)"/>
    <ellipse cx="120" cy="164" rx="6" ry="10"/>
    <ellipse cx="148" cy="146" rx="6" ry="10" transform="rotate(24 148 146)"/>
    <ellipse cx="72" cy="122" rx="5" ry="9" transform="rotate(-50 72 122)"/>
    <ellipse cx="168" cy="122" rx="5" ry="9" transform="rotate(50 168 122)"/>
  </g>
  <!-- compass needle on the cut face -->
  <path d="M120 24 L134 108 L120 98 L106 108 Z" fill="#123524"/>
